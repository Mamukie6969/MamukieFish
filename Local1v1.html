<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MamukieFish Local 1v1</title>
  <link rel="stylesheet" href="forLocal1v1.css">
</head>
<body>

  <div id="turnDisplay"></div>
  <div id="board"></div>

  <button id="flipButton">Flip Board</button>

  <div id="promotionPicker" class="picker hidden">
    <div class="picker-content">
      <h3>Promote Pawn</h3>
      <div class="promotion-options">
        <button data-piece="q" class="promo-btn"></button>
        <button data-piece="r" class="promo-btn"></button>
        <button data-piece="b" class="promo-btn"></button>
        <button data-piece="n" class="promo-btn"></button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
